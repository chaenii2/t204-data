<script>/* T204 데이터 로더: relay(중계 파일 1개) / direct(각 API 직접 호출) + 연결 진단 */
(function(){
const CFG = window.T204_CONFIG || {mode:'embedded'};
const pad=n=>String(n).padStart(2,'0');
const kst=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const qs=o=>Object.entries(o).map(([k,v])=>`${k}=${k==='serviceKey'?v:encodeURIComponent(v)}`).join('&');
async function getJSON(url,timeout=12000){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json();}
  finally{clearTimeout(t)}
}

/* ---------- 공모주 카드: 날짜 기준으로 화면에서 계산 ---------- */
function toDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ipoCards(list,today,evening){
  const day=86400000, t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const ref=new Date(t0.getTime()+(evening?day:0)); const out=[];
  [...list].sort((a,b)=>a.start.localeCompare(b.start)).forEach(o=>{
    const s=toDate(o.start), e=toDate(o.end);
    if(e<ref || (s-t0)/day>10) return;
    let badge;
    if(s<=t0 && t0<=e){ badge = +e===+t0?'오늘 마감':(evening && +e===+ref?'내일 마감':'청약 중'); }
    else { const n=Math.round((s-t0)/day); badge = n===1?'내일 시작':`D-${n}`; }
    const f=d=>`${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
    out.push({badge,name:o.name,period:`${f(s)} ~ ${f(e)}`,price:o.price,broker:o.broker});
  });
  return out.slice(0,2);
}
function finalize(feed){
  const now=kst();
  feed.date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  feed.dow=DOW[now.getDay()];
  feed.sample=false;
  feed.location=feed.location||'테헤란로 204 · 역삼';
  feed.updated=feed.updated||{morning:'',evening:''};
  feed.sponsor=feed.sponsor||{morning:'',evening:''};
  if(Array.isArray(feed.ipo_list)) feed.ipo={morning:ipoCards(feed.ipo_list,now,false),evening:ipoCards(feed.ipo_list,now,true)};
  return feed;
}

/* ---------- relay: 중계 파일 하나 ---------- */
async function loadRelay(){ return finalize(await getJSON(CFG.feedUrl+'?t='+Date.now())); }

/* ---------- direct: 각 API 직접 호출 ---------- */
const SKY={'1':'맑음','3':'구름많음','4':'흐림'}, PTY={'1':'비','2':'비/눈','3':'눈','4':'소나기','5':'빗방울','6':'빗방울눈날림','7':'눈날림'};
const iconOf=(sky,pty)=>pty&&pty!=='0'?'rain':({'1':'clear','3':'partly','4':'cloudy'}[sky]||'partly');
async function dWeather(){
  const now=kst(); let base=new Date(now); base.setHours(2,0,0,0);
  if(now.getHours()*60+now.getMinutes()<135){base=new Date(base.getTime()-86400000);base.setHours(23)}
  const d=await getJSON(`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,pageNo:1,numOfRows:1000,dataType:'JSON',base_date:ymd(base),base_time:pad(base.getHours())+'00',nx:61,ny:125}));
  const items=d.response.body.items.item, today=ymd(now), v={};
  items.filter(i=>i.fcstDate===today).forEach(i=>{(v[i.fcstTime]=v[i.fcstTime]||{})[i.category]=i.fcstValue});
  const ts=Object.values(v).filter(x=>x.TMP).map(x=>+x.TMP);
  const tmn=+(Object.values(v).find(x=>x.TMN)||{}).TMN||Math.min(...ts), tmx=+(Object.values(v).find(x=>x.TMX)||{}).TMX||Math.max(...ts);
  const day=Object.keys(v).sort().filter(t=>t>='0600'&&t<='2100');
  const pop=Math.max(...day.map(t=>+(v[t].POP||0)));
  const ptys=day.map(t=>v[t].PTY||'0').filter(x=>x!=='0'), skies=day.map(t=>v[t].SKY||'1');
  const mode=a=>a.sort((x,y)=>a.filter(z=>z===y).length-a.filter(z=>z===x).length)[0];
  let text,sky; if(ptys.length){text=PTY[mode(ptys)]||'비';sky='rain'}else{const m=mode(skies);text=SKY[m]||'구름많음';sky=iconOf(m,'0')}
  const hourly=['0900','1200','1500','1800'].filter(h=>v[h]&&v[h].TMP).map(h=>({h:`${+h.slice(0,2)}시`,t:Math.round(+v[h].TMP),sky:iconOf(v[h].SKY,v[h].PTY)}));
  const gap=Math.round(tmx-tmn);
  const tip=pop>=60?`강수확률 ${pop}%, 우산을 꼭 챙기세요`:gap>=10?`일교차 ${gap}도, 겉옷을 챙기세요`:tmx>=30?'무더운 날씨, 물 자주 드세요':tmn<=-5?'한파 주의, 따뜻하게 입으세요':'활동하기 좋은 날씨예요';
  const w={sky,text,min:Math.round(tmn),max:Math.round(tmx),pop,tip,hourly};
  try{ // 지금 기온 (초단기실황)
    const b=new Date(now.getTime()-40*60000);
    const n=await getJSON(`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,pageNo:1,numOfRows:20,dataType:'JSON',base_date:ymd(b),base_time:pad(b.getHours())+'00',nx:61,ny:125}));
    const t=n.response.body.items.item.find(i=>i.category==='T1H'); if(t) w.now={t:Math.round(+t.obsrValue),at:`${pad(b.getHours())}:00`};
  }catch(e){}
  return w;
}
async function dDust(){
  const d=await getJSON(`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,returnType:'json',numOfRows:12,pageNo:1,stationName:'강남구',dataTerm:'DAILY',ver:'1.0'}));
  const it=d.response.body.items.find(i=>i.pm10Value&&i.pm10Value!=='-'&&i.pm10Grade);
  return it?({'1':'좋음','2':'보통','3':'나쁨','4':'매우나쁨'}[it.pm10Grade]||'보통'):'보통';
}
async function dFx(){
  const FX=[['USD','미국 달러','USD',''],['JPY(100)','일본 엔','JPY','100엔'],['EUR','유로','EUR',''],['CNH','중국 위안','CNY','']];
  const found=[];
  for(let b=0;b<12&&found.length<2;b++){
    const day=new Date(kst().getTime()-b*86400000);
    const d=await getJSON(`https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?`+qs({authkey:CFG.keys.KOREAEXIM_KEY,searchdate:ymd(day),data:'AP01'}));
    if(Array.isArray(d)&&d.length&&+d[0].result===1){const m={};d.forEach(r=>m[r.cur_unit]=+String(r.deal_bas_r).replace(/,/g,''));found.push([day,m])}
  }
  const [[d0,cur],[,prev]]=found;
  return {basis:`${pad(d0.getMonth()+1)}.${pad(d0.getDate())} 매매기준율 · 한국수출입은행`,items:FX.filter(f=>cur[f[0]]).map(([k,n,c,u])=>({name:n,code:c,unit:u,v:cur[k],d:+(cur[k]-prev[k]).toFixed(2)}))};
}
async function dIpo(){
  const now=kst(), bg=ymd(new Date(now.getTime()-75*86400000)), ed=ymd(now);
  const l=await getJSON(`https://opendart.fss.or.kr/api/list.json?`+qs({crtfc_key:CFG.keys.DART_KEY,bgn_de:bg,end_de:ed,pblntf_detail_ty:'C001',page_count:100}));
  const seen=new Set(), out=[];
  for(const r of (l.list||[])){
    if(r.corp_cls!=='E'||seen.has(r.corp_code)) continue; seen.add(r.corp_code);
    if(seen.size>14) break;
    try{
      const d=await getJSON(`https://opendart.fss.or.kr/api/estkRs.json?`+qs({crtfc_key:CFG.keys.DART_KEY,corp_code:r.corp_code,bgn_de:bg,end_de:ed}));
      if(d.status!=='000') continue;
      const g={}; d.group.forEach(x=>g[x.title]=x.list);
      const gen=(g['일반사항']||[{}]).slice(-1)[0]; const m=[...(gen.sbd||'').matchAll(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/g)];
      if(!m.length) continue;
      const iso=x=>`${x[1]}-${pad(x[2])}-${pad(x[3])}`;
      const price=((g['증권의종류']||[{}]).slice(-1)[0].slprc)||gen.exprc||'-';
      const lead=(g['인수인정보']||[]).find(x=>x.actsen==='대표');
      out.push({name:gen.corp_name||r.corp_name,start:iso(m[0]),end:iso(m[m.length-1]),price:price&&price!=='-'?price+'원':'공모가 확정 전',broker:lead?'대표주관 '+lead.actnmn:''});
    }catch(e){}
  }
  return out;
}
async function loadDirect(){
  const feed={source:'direct'}; const errs=[];
  const run=async(k,fn,def)=>{try{feed[k]=await fn()}catch(e){feed[k]=def;errs.push(k+': '+e.message)}};
  const relayPart=async()=>{const r=await getJSON(CFG.feedUrl+'?t='+Date.now());return r};
  let rel=null;
  await Promise.all([run('weather',dWeather,null),run('_pm',dDust,null),(async()=>{try{rel=await relayPart()}catch(e){errs.push('relay: '+e.message)}})()]);
  feed.fx=(rel&&rel.fx)||{basis:'',items:[]}; feed.ipo_list=(rel&&rel.ipo_list)||[];
  if(feed.weather) feed.weather.pm=feed._pm||'보통';
  const n=kst(); feed.generated_at=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  feed.errors=errs; return finalize(feed);
}

window.T204_IPO = ipoCards;
window.T204_LOAD = async function(){
  if(CFG.mode==='relay') return loadRelay();

window.T204_DIAG = async function(root){
  const now=kst(), b=new Date(now.getTime()-40*60000);
  const T=[];
  if(CFG.mode==='relay') T.push(['중계 데이터 파일', CFG.feedUrl]);
  else {
    const k=CFG.keys||{};
    T.push(['기상청 (apis.data.go.kr)',`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?`+qs({serviceKey:k.DATA_GO_KR_KEY,pageNo:1,numOfRows:20,dataType:'JSON',base_date:ymd(b),base_time:pad(b.getHours())+'00',nx:61,ny:125})]);
    T.push(['에어코리아 (apis.data.go.kr)',`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?`+qs({serviceKey:k.DATA_GO_KR_KEY,returnType:'json',numOfRows:1,pageNo:1,stationName:'강남구',dataTerm:'DAILY',ver:'1.0'})]);
    T.push(['환율·공모주 중계 (chaenii2.github.io)', CFG.feedUrl]);
  }
  const rows=T.map(([n])=>`<tr><td>${n}</td><td class="st">확인 중…</td></tr>`).join('');
  root.innerHTML=`<div style="padding:70px 60px;font-size:34px;line-height:1.5;color:#fff">
    <div style="font-size:30px;color:#ff6a3d;font-weight:700">T204 연결 진단 · ${CFG.mode==='relay'?'A/C 중계 방식':'B 직접 호출 방식'}</div>
    <div style="font-size:26px;color:#9fb0cc;margin:8px 0 30px">${ymd(now)} ${pad(now.getHours())}:${pad(now.getMinutes())} · ${navigator.userAgent.slice(0,90)}</div>
    <table style="width:100%;border-collapse:collapse">${rows}</table>
    <div style="font-size:26px;color:#9fb0cc;margin-top:40px;line-height:1.6">✅ 연결 성공 · ⛔CORS 서버엔 닿지만 보안 정책으로 차단 · ⛔네트워크 방화벽 등으로 연결 불가<br>이 화면을 캡처해서 중앙일보 담당자에게 보내 주세요.</div></div>
    <style>td{padding:22px 10px;border-bottom:2px solid rgba(255,255,255,.15);vertical-align:top} td.st{width:52%;font-weight:700}</style>`;
  const cells=[...root.querySelectorAll('td.st')];
  await Promise.all(T.map(async([n,url],i)=>{
    const c=cells[i];
    try{const d=await getJSON(url,10000); c.innerHTML='✅ 연결 성공<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">'+JSON.stringify(d).slice(0,90).replace(/</g,'&lt;')+'</span>';}
    catch(e){
      let reach=false; try{await fetch(url,{mode:'no-cors',cache:'no-store'});reach=true}catch(_){}
      c.innerHTML = reach?'⛔ CORS 차단<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">서버 응답은 오지만 브라우저 보안 정책으로 읽을 수 없음</span>':'⛔ 연결 불가<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">'+String(e.message).slice(0,80)+'</span>';
    }
  }));
};
})();

<script>
(() => {
const W0=1200,H0=1824;
let DATA=JSON.parse(document.getElementById('t204-data').textContent);
const CFG=window.T204_CONFIG||{};
const $=s=>document.querySelector(s);
const fmt=(v,dec=2)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const sgn=d=>d>0?'▲':(d<0?'▼':'–'), cls=d=>d>0?'up':(d<0?'down':'');
const kst=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
const pad=n=>String(n).padStart(2,'0');
const pct=(d,v)=>d/(v-d)*100;
const A=()=>'';   // 고정형: 개별 요소 애니메이션 없음
function sunSvg(r){let rays='';for(let i=0;i<8;i++)rays+=`<rect x="-7" y="${-r-46}" width="14" height="30" rx="7" transform="rotate(${i*45})"/>`;return `<g class="spin" fill="#FFC542"><circle r="${r}"/>${rays}</g>`}
function weatherIcon(sky,size){
  const cloud='<g class="drift"><ellipse cx="-40" cy="40" rx="95" ry="62" fill="#e9eef8"/><ellipse cx="40" cy="20" rx="85" ry="80" fill="#f4f7fc"/><ellipse cx="95" cy="55" rx="70" ry="50" fill="#dfe6f2"/><rect x="-135" y="40" width="300" height="62" rx="31" fill="#e6ecf6"/></g>';
  let g;
  if(sky==='clear') g=sunSvg(78);
  else if(sky==='rain') g=`<g transform="translate(0,-30)">${cloud}</g>`+[-60,0,60].map((x,i)=>`<rect class="drop" data-i="${i}" x="${x-6}" y="90" width="12" height="40" rx="6" fill="#7cb8ff"/>`).join('');
  else if(sky==='snow'||sky==='sleet'){
    const flake=(x,i)=>`<g class="drop" data-i="${i}"><g transform="translate(${x},110)" stroke="#fff" stroke-width="7" stroke-linecap="round">${[0,60,120].map(r=>`<line x1="0" y1="-17" x2="0" y2="17" transform="rotate(${r})"/>`).join('')}</g></g>`;
    const drop=(x,i)=>`<rect class="drop" data-i="${i}" x="${x-6}" y="90" width="12" height="40" rx="6" fill="#7cb8ff"/>`;
    g=`<g transform="translate(0,-30)">${cloud}</g>`+[-60,0,60].map((x,i)=>sky==='sleet'&&i===1?drop(x,i):flake(x,i)).join('');}
  else if(sky==='cloudy') g=cloud;
  else g=`<g transform="translate(55,-60) scale(.85)">${sunSvg(70)}</g>${cloud}`;
  return `<svg width="${size}" height="${size}" viewBox="-170 -170 340 340" style="overflow:visible">${g}</svg>`;
}
//=g=>({'좋음':'#3aa0ff','보통':'#4ade80','나쁨':'#fb923c','매우나쁨':'#ff4d4f'}[g]||'#a9b6cc');
const SKYTXT_={clear:'맑은 하늘',partly:'구름 많은 하늘',cloudy:'흐린 하늘',rain:'비 오는 하늘',snow:'눈 오는 하늘',sleet:'비 또는 눈'};

function ipoItems(){
  const L=DATA.ipo_list||[]; if(!L.length) return [];
  const k=kst(), t0=new Date(k.getFullYear(),k.getMonth(),k.getDate()), day=86400000;
  const td=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, f=d=>`${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  return [...L].sort((a,b)=>a.start.localeCompare(b.start)).filter(o=>td(o.end)>=t0&&(td(o.start)-t0)/day<=14).slice(0,4).map(o=>{
    const s=td(o.start),e=td(o.end),n=Math.round((s-t0)/day);
    const badge=(s<=t0&&t0<=e)?(+e===+t0?'오늘 마감':'청약 중'):(n===1?'내일 시작':`D-${n}`);
    return {badge,hot:s<=t0,name:o.name,period:`${f(s)}~${f(e)}`,price:(o.price||'').includes('확정 전')?'공모가 미정':`공모가 ${o.price}`,broker:(o.broker||'').replace('대표주관 ','')};
  });
}

const ICO={
  car:'<path fill="#fff" stroke="none" d="M6.9 6.6A2 2 0 0 1 8.8 5.2h6.4a2 2 0 0 1 1.9 1.4l1.4 4.2A2 2 0 0 1 20 12.7V17a1 1 0 0 1-1 1h-.6v1.3a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-1V18H8.8v1.3a1 1 0 0 1-1 1H6.6a1 1 0 0 1-1-1V18H5a1 1 0 0 1-1-1v-4.3a2 2 0 0 1 1.5-1.9Zm1.6.6-1.1 3.4h9.2l-1.1-3.4ZM7.5 13.1a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm9 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z"/>',
  people:'<circle cx="9" cy="8.5" r="2.6"/><path d="M4.5 18c0-2.6 2-4.5 4.5-4.5s4.5 1.9 4.5 4.5"/><circle cx="16.2" cy="9.5" r="2.1"/><path d="M15 13.6c2.4-.3 4.5 1.5 4.5 4"/>',
  train:'<rect x="6.5" y="4.5" width="11" height="12" rx="2.5"/><path d="M6.5 11h11"/><circle cx="9.3" cy="13.8" r=".8" fill="currentColor"/><circle cx="14.7" cy="13.8" r=".8" fill="currentColor"/><path d="M9 16.5 7.5 19.5M15 16.5l1.5 3"/>',
  bike:'<circle cx="7" cy="15.5" r="3.2"/><circle cx="17" cy="15.5" r="3.2"/><path d="M7 15.5 10 9h5l2 6.5M10 9l3 6.5h4M9 7h2.5"/>',
  road:'<path d="M9 4.5 6 19.5M15 4.5l3 15M12 6v2.5M12 11v2.5M12 16v2.5"/>'};
const icon=(k,sz,stroke)=>`<span style="display:inline-flex;align-items:center;justify-content:center;width:${sz}px;height:${sz}px;border-radius:50%;border:${stroke}px solid rgba(255,255,255,.85);flex:none;vertical-align:middle"><svg viewBox="0 0 24 24" width="${Math.round(sz*.58)}" height="${Math.round(sz*.58)}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#fff">${ICO[k]}</svg></span>`;

function fresh(maxDays){if(!DATA.generated_at)return false;const [y,m,d]=DATA.generated_at.slice(0,10).split('-').map(Number);const t=kst();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/86400000)<=maxDays}
function spark(arr,w,h,color){
  if(!arr||arr.length<2) return '';
  const mn=Math.min(...arr),mx=Math.max(...arr),sp=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*(w-20)+6, h-16-(v-mn)/sp*(h-32)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const L=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible"><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${L[0]} ${h} L6 ${h} Z" fill="url(#gs)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${L[0]}" cy="${L[1]}" r="14" fill="${color}"/></svg>`;
}
const ST=k=>k>=25?'원활':k>=15?'서행':'정체', SC_=s=>({'원활':'#4ade80','서행':'#facc15','정체':'#ff4d4f'}[s]||'#fff');
const gradeColor=g=>({'좋음':'#4aa8ff','보통':'#4ade80','나쁨':'#fb923c','매우나쁨':'#ff4d4f'}[g]||'#c3cee0');

/* ---------- 클립 ---------- */
const CL={};
CL.finance={bg:'bg-navy',ok:()=>DATA.fx&&DATA.fx.items&&DATA.fx.items.length&&fresh(2),
  // 30초 = 환율 15초 + 증시 15초 (증시 데이터가 없으면 환율 30초)
  src:p=>p===1?((DATA.kr&&DATA.kr.basis)||'한국거래소'):((DATA.fx&&DATA.fx.basis)||'한국수출입은행'),
  html:()=>{
    const F=Object.fromEntries(DATA.fx.items.map(i=>[i.code,i])), U=F.USD;
    const K=(DATA.kr&&DATA.kr.items&&fresh(4))?DATA.kr.items:[];
    const R=(DATA.rates&&DATA.rates.items||[])[0];
    const hist=(DATA.fx_hist||[]).map(h=>h.v);
    const ipo=ipoItems().slice(0,2);
    const ip=ipo.length?`<div class="hr" style="left:56px;width:1092px;top:1260px"></div>
      <div class="pa" style="top:1295px"><span style="background:var(--red);font-size:38px;font-weight:700;padding:6px 26px 9px;border-radius:999px">공모주 청약</span></div>
      ${ipo.map((o,i)=>`<div class="pa" style="top:${1380+i*130}px"><div style="font-size:48px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2">${o.name}</div>
           <div class="num" style="font-size:32px;color:var(--sub);margin-top:4px">${o.period} · ${o.price}</div></div>
         <div class="pb" style="top:${1380+i*130}px;text-align:right"><div style="font-size:48px;font-weight:800;line-height:1.2;color:${o.hot?'#ff6b5e':'#ffd166'}">${o.badge}</div>
           <div style="font-size:32px;color:var(--sub);margin-top:4px;white-space:nowrap">대표주관 ${o.broker}</div></div>`).join('')}`:'';
    const row=(lbl,v,sub)=>`<div style="padding:20px 0;border-bottom:2px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="k">${lbl}</span>${sub?`<span class="num ${sub[1]}" style="font-size:36px;font-weight:700">${sub[0]}</span>`:''}</div><div class="num" style="font-size:70px;font-weight:800;line-height:1.12">${v}</div></div>`;
    let fb='';
    if(F.JPY) fb+=row('엔 (100엔)',fmt(F.JPY.v),[`${sgn(F.JPY.d)} ${fmt(Math.abs(F.JPY.d))}`,cls(F.JPY.d)]);

    if(R) fb+=row('기준금리',`${R.v.toFixed(2)}%`,null);
    const fx=`<div class="title">오늘의 환율</div>
      <div class="pa" style="top:440px"><div class="lbl">원/달러</div>
        <div class="num" style="font-size:118px;font-weight:900;line-height:1.1;margin-left:-4px;letter-spacing:-.03em">${fmt(U.v)}</div>
        <div class="num ${cls(U.d)}" style="font-size:58px;font-weight:700">${sgn(U.d)} ${fmt(Math.abs(U.d))}원</div></div>
      ${hist.length>1?`<div class="pa" style="top:850px"><div class="k" style="margin-bottom:18px">최근 달러 흐름</div>${spark(hist.slice(-15),510,250,'#4aa8ff')}</div>`:''}
      <div class="pb" style="top:420px">${fb}</div>
      ${ip}`;
    if(!K.length) return [fx];
    const idx=(it,box)=>`<div class="${box}" style="top:${box==='pa'?480:480}px"><div class="lbl">${it.code==='KOSPI'?'코스피':'코스닥'}</div>
        <div class="num" style="font-size:${box==='pa'?112:96}px;font-weight:900;line-height:1.1;letter-spacing:-.03em">${fmt(it.v)}</div>
        <div class="num ${cls(it.d)}" style="font-size:${box==='pa'?54:46}px;font-weight:700">${sgn(it.d)} ${fmt(Math.abs(it.d))}</div>
        <div class="num ${cls(it.d)}" style="font-size:${box==='pa'?54:46}px;font-weight:700">${(v=>(v>0?'+':'')+v.toFixed(2))(it.pct??pct(it.d,it.v))}%</div>
        ${it.hist&&it.hist.length>1?`<div style="margin-top:40px">${spark(it.hist,box==='pa'?510:392,260,it.d>=0?'#ff5a5f':'#4aa8ff')}</div>`:''}</div>`;

    const st=`<div class="title" style="letter-spacing:-.045em">오늘의 국내 증시</div>
      <div class="pa" style="top:378px;display:flex;align-items:center;gap:18px;white-space:nowrap">${kb?`<span class="k" style="font-size:34px">${kb} 종가 기준</span>`:''}</div>
      ${idx(K[0],'pa')}${K[1]?idx(K[1],'pb'):''}${ip}`;
    return [fx,st];
  }};
CL.weather={bg:()=>{const w=DATA.weather||{},sky=w.now_sky||w.sky,n=w.now||{};
    if(sky==='rain'||sky==='sleet')return 'bg-w-rain';
    if(sky==='snow')return 'bg-w-snow';
    const t=n.t!=null?n.t:(w.min+w.max)/2;
    return t>=25?'bg-w-hot':t>=17?'bg-w-warm':t<=5?'bg-w-cold':'bg-w-cool';},ok:()=>DATA.weather&&fresh(0),src:()=>'기상청 · 에어코리아',
  html:()=>{
    const w=DATA.weather, n=w.now||{}, T=w.tomorrow;
    const sky=w.now_sky||w.sky;
    const kv=(k,v)=>`<div style="padding:24px 0;border-bottom:2px solid var(--line)"><div class="k">${k}</div><div style="font-size:66px;font-weight:800;line-height:1.2">${v}</div></div>`;
    let b=kv('강수확률',`<span class="num">${w.pop}</span>%`);
    if(w.pm) b+=kv('미세먼지',`<span style="color:${gradeColor(w.pm)}">${w.pm}</span><span class="dot" style="background:${gradeColor(w.pm)}"></span>`);
    if(w.pm25) b+=kv('초미세먼지',`<span style="color:${gradeColor(w.pm25)}">${w.pm25}</span><span class="dot" style="background:${gradeColor(w.pm25)}"></span>`);
    if(n.reh!=null) b+=kv('습도 · 바람',`<span class="num" style="font-size:56px">${n.reh}% · ${n.wsd}m/s</span>`);
    return `<div class="title">오늘의 날씨</div>
      <div class="pa" style="top:420px;display:flex;align-items:center;gap:10px">${weatherIcon(sky,250)}</div>
      <div class="pa" style="top:690px"><div class="k">서울 역삼 · 지금</div>
        <div class="num" style="font-size:200px;font-weight:900;line-height:1;letter-spacing:-.05em;margin-left:-8px">${n.t!=null?n.t:Math.round((w.min+w.max)/2)}°</div>
        <div style="font-size:60px;font-weight:800;margin-top:10px">${w.text}</div>
        <div class="num" style="font-size:52px;font-weight:700;margin-top:8px;color:#e6edf8">최저 ${w.min}° / 최고 ${w.max}°</div></div>
      <div class="pb" style="top:400px">${b}</div>
      <div class="hr" style="left:56px;width:1092px;top:1395px"></div>
      <div class="pa" style="top:1420px;font-size:50px;font-weight:800;line-height:1.35;text-shadow:0 2px 14px rgba(0,0,0,.7)">${w.tip}</div>
      ${T?`<div class="pb" style="top:1420px;text-align:right;text-shadow:0 2px 14px rgba(0,0,0,.7)"><div class="k">내일</div><div class="num" style="font-size:52px;font-weight:800;line-height:1.2">${T.min}° / ${T.max}°</div><div style="font-size:44px;font-weight:700;line-height:1.25">${({clear:'맑음',partly:'구름 많음',cloudy:'흐림',rain:'비',snow:'눈',sleet:'비/눈'})[T.sky]||''}</div>${T.pop>=40?`<div class="k">강수 ${T.pop}%</div>`:''}</div>`:''}`;
  }};
CL.traffic={bg:'bg-green',ok:()=>{const T=DATA.traffic;if(!T)return false;if(!T.ts)return true;const [d,h]=T.ts.split(' '),[y,m,dd]=d.split('-').map(Number),[hh,mm]=h.split(':').map(Number);return (kst()-new Date(y,m-1,dd,hh,mm))<=60*60000},
  src:()=>DATA.traffic.basis||'서울시 도시데이터',
  html:()=>{
    const T=DATA.traffic, segs=(T.segments||[]).slice(0,4);

        <div style="height:20px;border-radius:10px;background:rgba(255,255,255,.16);margin-top:12px;overflow:hidden"><div style="height:100%;width:${Math.min(100,g.kmh/40*100)}%;background:${SC_(ST(g.kmh))};border-radius:10px"></div></div></div>`;
    const cg=T.congest, cgc={'여유':'#4ade80','보통':'#4ade80','약간 붐빔':'#facc15','붐빔':'#ff4d4f'}[cg]||'#fff';
    return `<div class="title">오늘의 교통</div>
      <div class="pa" style="top:430px;display:flex;align-items:center;gap:26px">${icon('car',120,4)}
        <div><div style="font-size:64px;font-weight:900;line-height:1.1">테헤란로</div><div class="k">강남역 ↔ 삼성역</div></div></div>

function draw(intro){
  let k=clipKey(); let c=CL[k]; let ok=false; try{ok=!!c.ok()}catch(e){}
  if(!ok){k='brand';c=CL.brand}
  $('#bg').className='bg '+(typeof c.bg==='function'?c.bg():c.bg);
  let h='';try{h=c.html()}catch(e){console.warn(e);c=CL.brand;$('#bg').className='bg bg-brand';h=c.html()}
  PAGES=Array.isArray(h)?h:[h]; CUR=c;
  if(k!=='brand'){PAGES=[coverHtml(k),...PAGES]}
  const n=PAGES.length; DUR=k==='brand'?[TOTAL_SEC]:[COVER_SEC,...Array(n-1).fill((TOTAL_SEC-COVER_SEC)/(n-1))];
  if(intro) T0=performance.now();
  $('#content').innerHTML=PAGES.map(x=>`<div class="page" style="position:absolute;inset:0;opacity:0;will-change:opacity,filter">${x}</div>`).join('');
  SHOWN=-1; frame(nowT());

  document.querySelector('.clock').style.visibility=k==='brand'?'hidden':'visible';

let PAGES=[],CUR=null,T0=performance.now(),SHOWN=-1,DUR=[30];
function pageAt(t){if(PAGES.length<2)return 0;t=(t??(performance.now()-T0)/1000)%TOTAL_SEC;let a=0;for(let i=0;i<DUR.length;i++){a+=DUR[i];if(t<a)return i}return DUR.length-1}
/* 장면 전환: 흐림 효과(나가는 화면은 흐려지며 사라지고, 들어오는 화면은 흐린 상태에서 선명해짐) */
const TR=.8, BLUR=18, ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const nowT=()=>(performance.now()-T0)/1000;
function frame(t){
  t=((t%TOTAL_SEC)+TOTAL_SEC)%TOTAL_SEC;
  const els=document.querySelectorAll('#content .page'); let a=0;
  els.forEach((e,i)=>{const b=a+DUR[i]; let v;
    if(i>0&&t>=a-TR/2&&t<a+TR/2) v=ease((t-(a-TR/2))/TR);      // 들어오는 중
    else if(i<els.length-1&&t>=b-TR/2&&t<b+TR/2) v=1-ease((t-(b-TR/2))/TR); // 나가는 중
    else v=(t>=a&&t<b)?1:0;
    e.style.opacity=v; e.style.filter=v>=.999?'none':`blur(${((1-v)*BLUR).toFixed(1)}px)`;
    if(i===0&&els.length>1){document.querySelector('.clock').style.opacity=1-v;document.querySelector('.logo').style.opacity=1-v;document.querySelector('.logo-w').style.opacity=1-v;}
    a=b;});
  showPage(pageAt(t));
}
function showPage(p,force){if(p===SHOWN&&!force)return;SHOWN=p;
  const cov=PAGES.length>1&&p===0;
  $('#src').textContent=cov?'':((CUR&&typeof CUR.src==='function'?CUR.src(p-(PAGES.length>1?1:0)):'')||'');
}
function clockTick(){const k=kst(),h=k.getHours(),dw='일월화수목금토'[k.getDay()],hm=`${pad(h%12||12)}:${pad(k.getMinutes())}`,ap=h<12?'AM':'PM';
  $('#cdate').textContent=`${pad(k.getMonth()+1)}.${pad(k.getDate())}(${dw})`;$('#ctime').textContent=`${hm} ${ap}`;
  const b=document.getElementById('bigtime'); if(b) b.textContent=hm;
  document.querySelectorAll('.ctime2').forEach(e=>e.textContent=hm);document.querySelectorAll('.campm').forEach(e=>e.textContent=ap);
  document.querySelectorAll('.cdate2').forEach(e=>e.textContent=`${pad(k.getMonth()+1)}.${pad(k.getDate())} (${dw})`);}
function fit(){const st=$('#stage'),s=Math.min(innerWidth/W0,innerHeight/H0);st.style.transform=`scale(${s})`;st.style.left=((innerWidth-W0*s)/2)+'px';st.style.top=((innerHeight-H0*s)/2)+'px'}
window.T204={setData(d){DATA=d;draw(false)},renderAt(t){if(!PAGES.length)draw(false);document.querySelector('.clock').style.transition='none';frame(t)},LOOP:30,W:W0,H:H0,clip:clipKey};

draw(true);
if(!window.__T204_RENDER){
  addEventListener('resize',fit);fit();
  if(/kiosk/.test(location.hash))document.body.classList.add('kiosk');
  $('#gbtn').onclick=e=>{$('#stage').classList.toggle('showguide');e.target.classList.toggle('on')};
  document.querySelectorAll('#ctl [data-c]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.c+(/sponsor/.test(location.hash)?'-sponsor':'');draw(true)});
  addEventListener('hashchange',()=>draw(true));
  if(/diag/.test(location.hash)||CFG.diag){document.body.classList.add('kiosk');$('#stage').innerHTML='<div id="diag"></div>';window.T204_DIAG&&T204_DIAG($('#diag'));return;}
  // 데이터: 열릴 때 1회 + 10분마다. 고정 화면이라 값만 조용히 바뀜
  const pull=()=>(window.T204_LOAD?T204_LOAD():Promise.resolve(null)).then(d=>{if(d){DATA=d;draw(false)}}).catch(e=>console.warn('T204 load',e));
  pull(); setInterval(pull,10*60*1000); setInterval(clockTick,5000); (function loop(){frame(nowT());requestAnimationFrame(loop)})(); setInterval(()=>frame(nowT()),100); // rAF가 멈추는 환경 대비
  let idle;addEventListener('mousemove',()=>{$('#ctl').style.opacity=1;clearTimeout(idle);idle=setTimeout(()=>$('#ctl').style.opacity=0,3000)});
}
})();
</script>
