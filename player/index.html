<script>/* T204 데이터 로더: relay(중계 파일 1개) / direct(각 API 직접 호출) + 연결 진단 */
(function(){
const CFG = window.T204_CONFIG || {mode:'embedded'};
const pad=n=>String(n).padStart(2,'0');
const kst=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const qs=o=>Object.entries(o).map(([k,v])=>`${k}=${k==='serviceKey'?v:encodeURIComponent(v)}`).join('&');
async function getJSON(url,timeout=12000){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json();}
  finally{clearTimeout(t)}
}

/* ---------- 공모주 카드: 날짜 기준으로 화면에서 계산 ---------- */
function toDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ipoCards(list,today,evening){
  const day=86400000, t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const ref=new Date(t0.getTime()+(evening?day:0)); const out=[];
  [...list].sort((a,b)=>a.start.localeCompare(b.start)).forEach(o=>{
    const s=toDate(o.start), e=toDate(o.end);
    if(e<ref || (s-t0)/day>10) return;
    let badge;
    if(s<=t0 && t0<=e){ badge = +e===+t0?'오늘 마감':(evening && +e===+ref?'내일 마감':'청약 중'); }
    else { const n=Math.round((s-t0)/day); badge = n===1?'내일 시작':`D-${n}`; }
    const f=d=>`${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
    out.push({badge,name:o.name,period:`${f(s)} ~ ${f(e)}`,price:o.price,broker:o.broker});
  });
  return out.slice(0,2);
}
function finalize(feed){
  const now=kst();
  feed.date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  feed.dow=DOW[now.getDay()];
  feed.sample=false;
  feed.location=feed.location||'테헤란로 204 · 역삼';
  feed.updated=feed.updated||{morning:'',evening:''};
  feed.sponsor=feed.sponsor||{morning:'',evening:''};
  if(Array.isArray(feed.ipo_list)) feed.ipo={morning:ipoCards(feed.ipo_list,now,false),evening:ipoCards(feed.ipo_list,now,true)};
  return feed;
}

/* ---------- relay: 중계 파일 하나 ---------- */
async function loadRelay(){ return finalize(await getJSON(CFG.feedUrl+'?t='+Date.now())); }

/* ---------- direct: 각 API 직접 호출 ---------- */
const SKY={'1':'맑음','3':'구름많음','4':'흐림'}, PTY={'1':'비','2':'비/눈','3':'눈','4':'소나기','5':'빗방울','6':'빗방울눈날림','7':'눈날림'};
const iconOf=(sky,pty)=>pty&&pty!=='0'?'rain':({'1':'clear','3':'partly','4':'cloudy'}[sky]||'partly');
async function dWeather(){
  const now=kst(); let base=new Date(now); base.setHours(2,0,0,0);
  if(now.getHours()*60+now.getMinutes()<135){base=new Date(base.getTime()-86400000);base.setHours(23)}
  const d=await getJSON(`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,pageNo:1,numOfRows:1000,dataType:'JSON',base_date:ymd(base),base_time:pad(base.getHours())+'00',nx:61,ny:125}));
  const items=d.response.body.items.item, today=ymd(now), v={};
  items.filter(i=>i.fcstDate===today).forEach(i=>{(v[i.fcstTime]=v[i.fcstTime]||{})[i.category]=i.fcstValue});
  const ts=Object.values(v).filter(x=>x.TMP).map(x=>+x.TMP);
  const tmn=+(Object.values(v).find(x=>x.TMN)||{}).TMN||Math.min(...ts), tmx=+(Object.values(v).find(x=>x.TMX)||{}).TMX||Math.max(...ts);
  const day=Object.keys(v).sort().filter(t=>t>='0600'&&t<='2100');
  const pop=Math.max(...day.map(t=>+(v[t].POP||0)));
  const ptys=day.map(t=>v[t].PTY||'0').filter(x=>x!=='0'), skies=day.map(t=>v[t].SKY||'1');
  const mode=a=>a.sort((x,y)=>a.filter(z=>z===y).length-a.filter(z=>z===x).length)[0];
  let text,sky; if(ptys.length){text=PTY[mode(ptys)]||'비';sky='rain'}else{const m=mode(skies);text=SKY[m]||'구름많음';sky=iconOf(m,'0')}
  const hourly=['0900','1200','1500','1800'].filter(h=>v[h]&&v[h].TMP).map(h=>({h:`${+h.slice(0,2)}시`,t:Math.round(+v[h].TMP),sky:iconOf(v[h].SKY,v[h].PTY)}));
  const gap=Math.round(tmx-tmn);
  const tip=pop>=60?`강수확률 ${pop}%, 우산을 꼭 챙기세요`:gap>=10?`일교차 ${gap}도, 겉옷을 챙기세요`:tmx>=30?'무더운 날씨, 물 자주 드세요':tmn<=-5?'한파 주의, 따뜻하게 입으세요':'활동하기 좋은 날씨예요';
  const w={sky,text,min:Math.round(tmn),max:Math.round(tmx),pop,tip,hourly};
  try{ // 지금 기온 (초단기실황)
    const b=new Date(now.getTime()-40*60000);
    const n=await getJSON(`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,pageNo:1,numOfRows:20,dataType:'JSON',base_date:ymd(b),base_time:pad(b.getHours())+'00',nx:61,ny:125}));
    const t=n.response.body.items.item.find(i=>i.category==='T1H'); if(t) w.now={t:Math.round(+t.obsrValue),at:`${pad(b.getHours())}:00`};
  }catch(e){}
  return w;
}
async function dDust(){
  const d=await getJSON(`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?`+qs({serviceKey:CFG.keys.DATA_GO_KR_KEY,returnType:'json',numOfRows:12,pageNo:1,stationName:'강남구',dataTerm:'DAILY',ver:'1.0'}));
  const it=d.response.body.items.find(i=>i.pm10Value&&i.pm10Value!=='-'&&i.pm10Grade);
  return it?({'1':'좋음','2':'보통','3':'나쁨','4':'매우나쁨'}[it.pm10Grade]||'보통'):'보통';
}
async function dFx(){
  const FX=[['USD','미국 달러','USD',''],['JPY(100)','일본 엔','JPY','100엔'],['EUR','유로','EUR',''],['CNH','중국 위안','CNY','']];
  const found=[];
  for(let b=0;b<12&&found.length<2;b++){
    const day=new Date(kst().getTime()-b*86400000);
    const d=await getJSON(`https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON?`+qs({authkey:CFG.keys.KOREAEXIM_KEY,searchdate:ymd(day),data:'AP01'}));
    if(Array.isArray(d)&&d.length&&+d[0].result===1){const m={};d.forEach(r=>m[r.cur_unit]=+String(r.deal_bas_r).replace(/,/g,''));found.push([day,m])}
  }
  const [[d0,cur],[,prev]]=found;
  return {basis:`${pad(d0.getMonth()+1)}.${pad(d0.getDate())} 매매기준율 · 한국수출입은행`,items:FX.filter(f=>cur[f[0]]).map(([k,n,c,u])=>({name:n,code:c,unit:u,v:cur[k],d:+(cur[k]-prev[k]).toFixed(2)}))};
}
async function dIpo(){
  const now=kst(), bg=ymd(new Date(now.getTime()-75*86400000)), ed=ymd(now);
  const l=await getJSON(`https://opendart.fss.or.kr/api/list.json?`+qs({crtfc_key:CFG.keys.DART_KEY,bgn_de:bg,end_de:ed,pblntf_detail_ty:'C001',page_count:100}));
  const seen=new Set(), out=[];
  for(const r of (l.list||[])){
    if(r.corp_cls!=='E'||seen.has(r.corp_code)) continue; seen.add(r.corp_code);
    if(seen.size>14) break;
    try{
      const d=await getJSON(`https://opendart.fss.or.kr/api/estkRs.json?`+qs({crtfc_key:CFG.keys.DART_KEY,corp_code:r.corp_code,bgn_de:bg,end_de:ed}));
      if(d.status!=='000') continue;
      const g={}; d.group.forEach(x=>g[x.title]=x.list);
      const gen=(g['일반사항']||[{}]).slice(-1)[0]; const m=[...(gen.sbd||'').matchAll(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/g)];
      if(!m.length) continue;
      const iso=x=>`${x[1]}-${pad(x[2])}-${pad(x[3])}`;
      const price=((g['증권의종류']||[{}]).slice(-1)[0].slprc)||gen.exprc||'-';
      const lead=(g['인수인정보']||[]).find(x=>x.actsen==='대표');
      out.push({name:gen.corp_name||r.corp_name,start:iso(m[0]),end:iso(m[m.length-1]),price:price&&price!=='-'?price+'원':'공모가 확정 전',broker:lead?'대표주관 '+lead.actnmn:''});
    }catch(e){}
  }
  return out;
}
async function loadDirect(){
  const feed={source:'direct'}; const errs=[];
  const run=async(k,fn,def)=>{try{feed[k]=await fn()}catch(e){feed[k]=def;errs.push(k+': '+e.message)}};
  const relayPart=async()=>{const r=await getJSON(CFG.feedUrl+'?t='+Date.now());return r};
  let rel=null;
  await Promise.all([run('weather',dWeather,null),run('_pm',dDust,null),(async()=>{try{rel=await relayPart()}catch(e){errs.push('relay: '+e.message)}})()]);
  feed.fx=(rel&&rel.fx)||{basis:'',items:[]}; feed.ipo_list=(rel&&rel.ipo_list)||[];
  if(feed.weather) feed.weather.pm=feed._pm||'보통';
  const n=kst(); feed.generated_at=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())} ${pad(n.getHours())}:${pad(n.getMinutes())}`;
  feed.errors=errs; return finalize(feed);
}

window.T204_IPO = ipoCards;
window.T204_LOAD = async function(){
  if(CFG.mode==='relay') return loadRelay();
  if(CFG.mode==='direct') return loadDirect();
  return null;
};

/* ---------- 연결 진단 화면 (#diag) ---------- */
window.T204_DIAG = async function(root){
  const now=kst(), b=new Date(now.getTime()-40*60000);
  const T=[];
  if(CFG.mode==='relay') T.push(['중계 데이터 파일', CFG.feedUrl]);
  else {
    const k=CFG.keys||{};
    T.push(['기상청 (apis.data.go.kr)',`https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?`+qs({serviceKey:k.DATA_GO_KR_KEY,pageNo:1,numOfRows:20,dataType:'JSON',base_date:ymd(b),base_time:pad(b.getHours())+'00',nx:61,ny:125})]);
    T.push(['에어코리아 (apis.data.go.kr)',`https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getMsrstnAcctoRltmMesureDnsty?`+qs({serviceKey:k.DATA_GO_KR_KEY,returnType:'json',numOfRows:1,pageNo:1,stationName:'강남구',dataTerm:'DAILY',ver:'1.0'})]);
    T.push(['환율·공모주 중계 (chaenii2.github.io)', CFG.feedUrl]);
  }
  const rows=T.map(([n])=>`<tr><td>${n}</td><td class="st">확인 중…</td></tr>`).join('');
  root.innerHTML=`<div style="padding:70px 60px;font-size:34px;line-height:1.5;color:#fff">
    <div style="font-size:30px;color:#ff6a3d;font-weight:700">T204 연결 진단 · ${CFG.mode==='relay'?'A/C 중계 방식':'B 직접 호출 방식'}</div>
    <div style="font-size:26px;color:#9fb0cc;margin:8px 0 30px">${ymd(now)} ${pad(now.getHours())}:${pad(now.getMinutes())} · ${navigator.userAgent.slice(0,90)}</div>
    <table style="width:100%;border-collapse:collapse">${rows}</table>
    <div style="font-size:26px;color:#9fb0cc;margin-top:40px;line-height:1.6">✅ 연결 성공 · ⛔CORS 서버엔 닿지만 보안 정책으로 차단 · ⛔네트워크 방화벽 등으로 연결 불가<br>이 화면을 캡처해서 중앙일보 담당자에게 보내 주세요.</div></div>
    <style>td{padding:22px 10px;border-bottom:2px solid rgba(255,255,255,.15);vertical-align:top} td.st{width:52%;font-weight:700}</style>`;
  const cells=[...root.querySelectorAll('td.st')];
  await Promise.all(T.map(async([n,url],i)=>{
    const c=cells[i];
    try{const d=await getJSON(url,10000); c.innerHTML='✅ 연결 성공<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">'+JSON.stringify(d).slice(0,90).replace(/</g,'&lt;')+'</span>';}
    catch(e){
      let reach=false; try{await fetch(url,{mode:'no-cors',cache:'no-store'});reach=true}catch(_){}
      c.innerHTML = reach?'⛔ CORS 차단<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">서버 응답은 오지만 브라우저 보안 정책으로 읽을 수 없음</span>':'⛔ 연결 불가<br><span style="font-size:24px;font-weight:400;color:#9fb0cc">'+String(e.message).slice(0,80)+'</span>';
    }
  }));
};
})();
</script>
<script>
(() => {
const W0=1200,H0=1824, FADE=.6;
let DATA=JSON.parse(document.getElementById('t204-data').textContent);
const $=s=>document.querySelector(s);
const fmt=(v,dec=2)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const sgn=d=>d>0?'▲':(d<0?'▼':'–'), cls=d=>d>0?'up':(d<0?'down':'');
const clamp=x=>Math.min(1,Math.max(0,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const out3=x=>1-Math.pow(1-x,3), outBack=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const A=(anim,d,extra='')=>`data-anim="${anim}" data-d="${d}" ${extra}`;
const P=(a,b,top=300)=>`<div class="pa" style="top:${top}px">${a}</div><div class="pb" style="top:${top}px">${b}</div>`;
const kst=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
const pad=n=>String(n).padStart(2,'0');
const pct=(d,v)=>d/(v-d)*100;

/* ---------- 그래픽 ---------- */
function spark(arr,w,h,color,id){
  if(!arr||arr.length<2) return '';
  const mn=Math.min(...arr),mx=Math.max(...arr),sp=(mx-mn)||1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*(w-16)+4, h-14-(v-mn)/sp*(h-28)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const L=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${L[0]} ${h} L4 ${h} Z" fill="url(#g${id})" ${A('fade',1.2)}/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" ${A('draw',.5,'data-dur="1.8"')}/>
    <circle cx="${L[0]}" cy="${L[1]}" r="13" fill="${color}" ${A('pop',2.1)}/><circle cx="${L[0]}" cy="${L[1]}" r="26" fill="${color}" opacity=".25" class="pulse"/></svg>`;
}
function sunSvg(r){let rays='';for(let i=0;i<8;i++)rays+=`<rect x="-7" y="${-r-46}" width="14" height="30" rx="7" transform="rotate(${i*45})"/>`;return `<g class="spin" fill="#FFC542"><circle r="${r}"/>${rays}</g>`}
function weatherIcon(sky,size){
  const cloud='<g class="drift"><ellipse cx="-40" cy="40" rx="95" ry="62" fill="#e9eef8"/><ellipse cx="40" cy="20" rx="85" ry="80" fill="#f4f7fc"/><ellipse cx="95" cy="55" rx="70" ry="50" fill="#dfe6f2"/><rect x="-135" y="40" width="300" height="62" rx="31" fill="#e6ecf6"/></g>';
  let g;
  if(sky==='clear') g=sunSvg(78);
  else if(sky==='rain') g=`<g transform="translate(0,-30)">${cloud}</g>`+[-60,0,60].map((x,i)=>`<rect class="drop" data-i="${i}" x="${x-6}" y="90" width="12" height="40" rx="6" fill="#7cb8ff"/>`).join('');
  else if(sky==='cloudy') g=cloud;
  else g=`<g transform="translate(55,-60) scale(.85)">${sunSvg(70)}</g>${cloud}`;
  return `<svg width="${size}" height="${size}" viewBox="-170 -170 340 340" style="overflow:visible">${g}</svg>`;
}
const gradeColor=g=>({'좋음':'#3aa0ff','보통':'#4ade80','나쁨':'#fb923c','매우나쁨':'#ff4d4f'}[g]||'#a9b6cc');
const SKYTXT={clear:'맑은 하늘',partly:'구름 많은 하늘',cloudy:'흐린 하늘',rain:'비 오는 하늘'};

/* ---------- 공모주 청약 롤링 ---------- */
function ipoItems(){
  const L=DATA.ipo_list||[]; if(!L.length) return [];
  const k=kst(), t0=new Date(k.getFullYear(),k.getMonth(),k.getDate()), day=86400000;
  const td=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}, f=d=>`${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  return [...L].sort((a,b)=>a.start.localeCompare(b.start)).filter(o=>td(o.end)>=t0&&(td(o.start)-t0)/day<=14).slice(0,4).map(o=>{
    const s=td(o.start),e=td(o.end),n=Math.round((s-t0)/day);
    const badge=(s<=t0&&t0<=e)?(+e===+t0?'오늘 마감':'청약 중'):(n===1?'내일 시작':`D-${n}`);
    return {badge,hot:s<=t0,name:o.name,period:`${f(s)}~${f(e)}`,price:(o.price||'').includes('확정 전')?'공모가 미정':`공모가 ${o.price}`,broker:(o.broker||'').replace('대표주관 ','')};
  });
}
function ipoTicker(dur,top){
  const it=ipoItems(); if(!it.length) return '';
  const s0=1.2, slot=(dur-s0-.6)/it.length;
  return `<div class="divider" style="top:${top-34}px"></div>

     ${it.map((o,i)=>`<div class="roll" data-s="${s0+i*slot}" data-e="${s0+(i+1)*slot}" style="position:absolute;left:0;top:66px;width:520px;opacity:0">
        <div style="font-size:44px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.name}</div>
        <div class="num" style="font-size:30px;color:#c9d6ee;margin-top:2px">${o.period} · ${o.price}</div></div>`).join('')}
   </div>
   <div class="pb" style="top:${top}px;height:130px" ${A('fade',1)}>
     ${it.map((o,i)=>`<div class="roll" data-s="${s0+i*slot}" data-e="${s0+(i+1)*slot}" style="position:absolute;right:0;top:20px;text-align:right;opacity:0">
        <div style="font-size:52px;font-weight:900;color:${o.hot?'#ff6b5e':'#ffd166'}">${o.badge}</div>
        <div style="font-size:28px;color:#c9d6ee;margin-top:6px">대표주관 ${o.broker}</div></div>`).join('')}
     <div style="position:absolute;right:0;top:-6px;font-size:24px;color:rgba(255,255,255,.5)" class="num">${it.length>1?'':''}</div>
   </div>`;
}

/* ---------- 장면 ---------- */
const SC={};
SC.open={dur:8,bg:'open',src:'',ok:()=>true,html:()=>`
  <div class="pa" style="top:430px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;width:500px" ${A('up',.1)}>
      <span class="num" style="font-size:54px;font-weight:700"><span class="odate"></span></span>
      <span style="font-size:54px;font-weight:600;color:#c9d6ee" class="oampm"></span></div>
    <div class="num otime" style="font-size:192px;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:6px 0 0 -8px;text-shadow:0 0 28px rgba(140,190,255,.75),0 0 6px rgba(200,225,255,.6)" ${A('up',.25)}></div>
    <div style="width:100px;height:10px;background:#ef3b24;border-radius:5px;margin:56px 0 34px" ${A('grow',.6)}></div>
    <div style="font-size:72px;font-weight:800;letter-spacing:-.01em" ${A('up',.75)}>T204</div>
    <div style="font-size:58px;font-weight:400;color:#dbe4f3;margin-top:4px" ${A('up',.85)}>오늘의 인사이트</div>
    <div style="font-size:44px;font-weight:400;line-height:1.55;color:#c9d6ee;margin-top:70px" ${A('up',1.05)}>중앙일보가 전하는<br>오늘의 주요 경제 소식</div>
  </div>`};

SC.fx={dur:10,bg:'navy',ok:()=>DATA.fx&&DATA.fx.items&&DATA.fx.items.length&&fresh(2),src:()=>`${DATA.fx.basis||''}`,
  html:()=>{
    const F=DATA.fx, u=F.items[0], hist=(DATA.fx_hist||[]).map(x=>x.v), rest=F.items.slice(1);
    const R=(DATA.rates&&DATA.rates.items||[])[0];
    return P(`
      <div class="title" ${A('up',0)}>오늘의 환율</div>
      <div class="lbl" style="margin-top:70px" ${A('up',.2)}>USD / KRW</div>
      <div class="num" style="font-size:120px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin:6px 0 0 -6px" ${A('up',.3)}><span data-count="${u.v}" data-from="${u.v*0.995}" data-dec="2">${fmt(u.v)}</span></div>
      <div class="num ${cls(u.d)}" style="font-size:56px;font-weight:700;margin-top:10px" ${A('fade',.8)}>${sgn(u.d)} ${fmt(Math.abs(u.d))} &nbsp;${u.d>0?'+':''}${pct(u.d,u.v).toFixed(2)}%</div>`,
    `<div style="padding-top:150px">${rest.map((r,i)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:2px solid var(--line)" ${A('up',.6+i*.12)}>
        <span style="font-size:34px;font-weight:700">${r.code}${r.unit?` <span style="font-size:24px;color:var(--sub)">(${r.unit})</span>`:''}</span>
        <span style="text-align:right"><span class="num" style="font-size:40px;font-weight:700">${fmt(r.v)}</span><br><span class="num ${cls(r.d)}" style="font-size:26px;font-weight:700">${sgn(r.d)} ${fmt(Math.abs(r.d))}</span></span></div>`).join('')}</div>`)
    +`<div style="position:absolute;left:56px;top:880px" ${A('fade',.4)}>${spark(hist.length>1?hist:null,1090,280,'#3aa0ff','fx')}</div>`
    +ipoTicker(SC.fx.dur,1480)
    +(R?`<div class="divider" style="top:1215px"></div>
      <div class="pa" style="top:1250px;display:flex;align-items:center;gap:34px" ${A('up',1.4)}>
        <div style="width:120px;height:120px;border-radius:50%;border:3px solid rgba(58,160,255,.6);background:rgba(58,160,255,.12);display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:700">%</div>
        <div><div class="num" style="font-size:72px;font-weight:900">${R.v.toFixed(2)}%</div><div class="k" style="font-size:34px;color:#dbe4f3">${R.name}</div></div></div>`:'');
  }};

SC.stock={dur:10,bg:'navy',ok:()=>DATA.kr&&DATA.kr.items&&DATA.kr.items.length>0&&fresh(4),src:()=>DATA.kr.basis||'',
  html:()=>{
    const K=DATA.kr.items, blk=(it,w,d)=>`<div class="lbl" ${A('up',d)}>${it.code}</div>
      <div class="num" style="font-size:${w>450?120:104}px;font-weight:900;letter-spacing:-.04em;line-height:1.05;margin-left:-4px" ${A('up',d+.1)}><span data-count="${it.v}" data-from="${it.v*0.99}" data-dec="2">${fmt(it.v)}</span></div>
      <div class="num ${cls(it.d)}" style="font-size:50px;font-weight:700;margin-top:6px" ${A('fade',d+.6)}>${sgn(it.d)} ${fmt(Math.abs(it.d))} &nbsp;${it.pct>0?'+':''}${(it.pct??pct(it.d,it.v)).toFixed(2)}%</div>
      <div style="margin-top:40px" ${A('fade',d+.3)}>${spark(it.hist,w,240,it.d>=0?'#ff4d4f':'#3aa0ff','s'+it.code)}</div>`;
    return P(`<div class="title" ${A('up',0)}>국내 증시</div><div style="margin-top:80px">${blk(K[0],480,.2)}</div>`,
             `<div style="padding-top:194px">${K[1]?blk(K[1],380,.5):''}</div>`)+ipoTicker(SC.stock.dur,1480);
  }};

SC.weather={dur:8,bg:'sky',ok:()=>DATA.weather&&fresh(0),src:()=>'기상청 · 에어코리아',
  html:()=>{
    const w=DATA.weather, now=w.now||{}, sky=w.now_sky||w.sky, H=(w.hourly||[]).slice(0,6), T=w.tomorrow;
    const hr=(h,i)=>`<div style="text-align:center;width:150px" ${A('up',1+i*.08)}><div class="num" style="font-size:30px;color:#eef2f8">${h.h}</div>
      <div style="height:96px;display:flex;align-items:center;justify-content:center">${weatherIcon(h.sky,96)}</div><div class="num" style="font-size:42px;font-weight:700">${h.t}°</div></div>`;
    const extra=[now.reh!=null?`습도 ${now.reh}%`:'',now.wsd!=null?`바람 ${now.wsd}m/s`:''].filter(Boolean).join(' · ');
    return P(`<div class="title" ${A('up',0)}>오늘의 날씨</div>
        <div style="margin:60px 0 0 30px" ${A('scale',.3)}>${weatherIcon(sky,330)}</div>
        <div style="font-size:42px;font-weight:700;margin-top:20px;line-height:1.35" ${A('up',.8)}>${w.tip||''}</div>`,
      `<div style="padding-top:160px;border-left:3px solid rgba(255,255,255,.35);padding-left:40px;margin-left:-40px">
        <div style="font-size:42px;font-weight:700" ${A('up',.4)}>서울 역삼</div>
        <div class="num" style="font-size:160px;font-weight:900;letter-spacing:-.05em;line-height:1.05" ${A('up',.5)}>${now.t??w.max}°C</div>
        <div style="font-size:42px;font-weight:500;color:#eef2f8" ${A('up',.6)}>${SKYTXT[sky]||w.text}</div>
        <div class="num" style="font-size:34px;color:#e6ebf3;margin-top:24px;line-height:1.6" ${A('up',.75)}>최저 ${w.min}° · 최고 ${w.max}°<br>강수확률 ${w.pop}%${extra?'<br>'+extra:''}</div></div>`)
     +(H.length?`<div style="position:absolute;left:0;right:0;top:1150px;height:250px;background:rgba(10,20,40,.28)" ${A('fade',.9)}></div>
       <div class="pa" style="top:1175px;display:flex;justify-content:space-between">${H.slice(0,3).map(hr).join('')}</div>
       <div class="pb" style="top:1175px;display:flex;justify-content:space-between">${H.slice(3,6).map((h,i)=>hr(h,i+3)).join('')}</div>`:'')
     +(T?`<div class="pa" style="top:1470px;font-size:38px;font-weight:700" ${A('up',1.4)}>내일 <span class="num">${T.min}° / ${T.max}°</span> · ${({clear:'맑음',partly:'구름 많음',cloudy:'흐림',rain:'비'})[T.sky]||''}${T.pop>=40?` · 강수 ${T.pop}%`:''}</div>`:'')
     +((w.pm||w.pm25)?`<div class="divider" style="top:1580px;background:rgba(255,255,255,.3)"></div>`:'')
     +(w.pm?`<div class="pa" style="top:1615px;font-size:40px;font-weight:700" ${A('up',1.1)}>미세먼지 <span style="color:${gradeColor(w.pm)}">${w.pm}</span><span class="dot" style="background:${gradeColor(w.pm)}"></span></div>`:'')
     +(w.pm25?`<div class="pb" style="top:1615px;font-size:40px;font-weight:700" ${A('up',1.2)}>초미세먼지 <span style="color:${gradeColor(w.pm25)}">${w.pm25}</span><span class="dot" style="background:${gradeColor(w.pm25)}"></span></div>`:'');
  }};

SC.traffic={dur:8,bg:'green',ok:()=>!!DATA.traffic,src:()=>'서울시 실시간 도시데이터',
  html:()=>{
    const T=DATA.traffic, c={'원활':'#4ade80','서행':'#facc15','정체':'#ff4d4f'}[T.status]||'#4ade80';
    return P(`<div class="title" ${A('up',0)}>오늘의 교통</div>
        <div style="margin:200px 0 0 60px;width:240px;height:240px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center" ${A('scale',.3)}>
          <svg width="130" height="110" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M18 58 L30 24 Q33 16 42 16 H88 Q97 16 100 24 L112 58"/><rect x="10" y="56" width="110" height="34" rx="12"/><path d="M22 90 v12 M108 90 v12"/><circle cx="34" cy="73" r="6" fill="#fff"/><circle cx="96" cy="73" r="6" fill="#fff"/></svg></div>`,
      `<div style="padding-top:300px;border-left:3px solid rgba(255,255,255,.35);padding-left:40px;margin-left:-40px">
        <div style="font-size:46px;font-weight:700" ${A('up',.4)}>테헤란로</div><div style="font-size:34px;color:#cfe9e0" ${A('up',.5)}>역삼 ↔ 삼성</div>
        <div style="font-size:150px;font-weight:900;color:${c};letter-spacing:-.04em;margin-top:20px" ${A('up',.7)}>${T.status||'-'}</div>
        ${T.kmh?`<div class="num" style="font-size:40px;color:#e6f5ef" ${A('up',.9)}>평균 ${T.kmh}km/h</div>`:''}
        ${T.congest?`<div style="font-size:36px;color:#e6f5ef;margin-top:30px" ${A('up',1.1)}>역삼역 일대 ${T.congest}</div>`:''}</div>`);
  }};

const ORDER=['open','fx','stock','weather','traffic'];
const TITLES={fx:'오늘의 환율',stock:'국내 증시',weather:'오늘의 날씨',traffic:'오늘의 교통'};
function fresh(maxDays){if(!DATA.generated_at)return false;const [y,m,d]=DATA.generated_at.slice(0,10).split('-').map(Number);const t=kst();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/86400000)<=maxDays}
let LIST=[]; const lineup=()=>LIST.filter(k=>k!=='open').map(k=>TITLES[k]);
let scenes=[],LOOP=8,pending=null;

function build(){
  LIST=ORDER.filter(k=>{try{return SC[k].ok()}catch(e){return false}});
  let t=0; const html=[];
  scenes=LIST.map(k=>{const s={key:k,a:t,b:t+SC[k].dur,bg:SC[k].bg};t+=SC[k].dur;return s});
  LOOP=t;
  setTimeout(clockTick,0);
  $('#scenes').innerHTML=LIST.map(k=>`<section class="scene">${SC[k].html()}</section>`).join('');
  $('#prog').innerHTML=LIST.map(()=>'<i><b></b></i>').join('');
  const els=[...document.querySelectorAll('#scenes .scene')];
  scenes.forEach((s,i)=>{const el=els[i];Object.assign(s,{el,src:typeof SC[s.key].src==='function'?SC[s.key].src():'',
    rolls:[...el.querySelectorAll('.roll')],items:[...el.querySelectorAll('[data-anim]')],counts:[...el.querySelectorAll('[data-count]')],
    spins:[...el.querySelectorAll('.spin')],drifts:[...el.querySelectorAll('.drift')],drops:[...el.querySelectorAll('.drop')],pulses:[...el.querySelectorAll('.pulse')]})});
}
const bgs=()=>[...document.querySelectorAll('.bg')];
function clockTick(){const k=kst(),h=k.getHours(),dd=`${pad(k.getMonth()+1)}.${pad(k.getDate())}`,dw='일월화수목금토'[k.getDay()],hm=`${pad(h%12||12)}:${pad(k.getMinutes())}`,ap=h<12?'AM':'PM';
  $('#cdate').textContent=`${dd}(${dw})`;$('#ctime').textContent=`${hm} ${ap}`;
  document.querySelectorAll('.odate').forEach(e=>e.textContent=`${dd} (${dw})`);document.querySelectorAll('.otime').forEach(e=>e.textContent=hm);document.querySelectorAll('.oampm').forEach(e=>e.textContent=ap)}

function render(t){
  t=((t%LOOP)+LOOP)%LOOP;
  for(const s of scenes){
    const vis=t>=s.a&&t<s.b; const L=t-s.a;
    if(!vis){s.el.style.display='none';continue}
    s.el.style.display='block';
    const inP=out3(seg(L,0,FADE)),outP=seg(t,s.b-FADE*.8,s.b);
    s.el.style.opacity=Math.min(inP,1-outP);
    s.el.style.transform=`translateY(${(1-inP)*30-40*out3(outP)}px)`;
    for(const e of s.items){
      const d=+e.dataset.d||0,dur=+(e.dataset.dur||.7),p=seg(L,d,d+dur),q=out3(p);
      switch(e.dataset.anim){
        case 'up':e.style.opacity=q;e.style.transform=`translateY(${(1-q)*60}px)`;break;
        case 'fade':e.style.opacity=q;break;
        case 'scale':e.style.opacity=q;e.style.transform=`scale(${.85+.15*outBack(p)})`;break;
        case 'grow':e.style.transformOrigin='left';e.style.transform=`scaleX(${q})`;break;
        case 'draw':e.style.strokeDashoffset=1-q;break;
        case 'pop':e.style.opacity=q;break;
      }
    }
    for(const r of s.rolls){const a=+r.dataset.s,e=+r.dataset.e,last=r===s.rolls[s.rolls.length-1]||r.nextElementSibling==null||!r.nextElementSibling.classList.contains('roll');
      const pin=out3(seg(L,a,a+.45)),pout=last?0:out3(seg(L,e-.35,e));r.style.opacity=Math.max(0,pin-pout);r.style.transform=`translateY(${(1-pin)*40-pout*40}px)`}
    for(const c of s.counts){const to=+c.dataset.count,fr=+c.dataset.from,dec=+c.dataset.dec,q=out3(seg(L,.3,1.5));c.textContent=fmt(fr+(to-fr)*q,dec)}
    s.spins.forEach(g=>g.setAttribute('transform',`rotate(${t*14})`));
    s.drifts.forEach(g=>g.setAttribute('transform',`translate(${Math.sin(t*.7)*12},0)`));
    s.drops.forEach(r=>{const k=(t*1.3+(+r.dataset.i)*.33)%1;r.setAttribute('transform',`translate(0,${k*70})`);r.style.opacity=1-k});
    s.pulses.forEach(c=>{const k=(t*.8)%1;c.setAttribute('r',13+k*26);c.setAttribute('opacity',.35*(1-k))});
    $('#src').textContent=s.src||'';
  }
  // 배경: 현재 장면 배경으로 교차 전환
  const cur=scenes.find(s=>t>=s.a&&t<s.b); const nxt=scenes[(scenes.indexOf(cur)+1)%scenes.length];
  const mix=cur?seg(t,cur.b-FADE,cur.b):0;
  bgs().forEach(b=>{const k=b.dataset.bg;let o=0;if(cur&&k===cur.bg)o=1-mix;if(nxt&&k===nxt.bg)o=Math.max(o,mix);if(cur&&nxt&&cur.bg===nxt.bg&&k===cur.bg)o=1;b.style.opacity=o});
  {const o=scenes.find(s=>s.key==='open');let h=0;if(o){h=t<o.b?1-seg(t,o.b-FADE,o.b):seg(t,LOOP-FADE,LOOP)}$('#hclock').style.opacity=1-h}
  document.querySelectorAll('#prog b').forEach((b,i)=>{const s=scenes[i];b.style.width=(seg(t,s.a,s.b)*100)+'%'});
}

function fit(){const st=$('#stage'),s=Math.min(innerWidth/W0,innerHeight/H0);st.style.transform=`scale(${s})`;st.style.left=((innerWidth-W0*s)/2)+'px';st.style.top=((innerHeight-H0*s)/2)+'px'}
window.T204={setData(d){pending=d},renderAt(t){if(!scenes.length)build();clockTick();render(t)},get LOOP(){if(!scenes.length)build();return LOOP},W:W0,H:H0};

build(); clockTick();
if(!window.__T204_RENDER){
  addEventListener('resize',fit);fit();
  if(/kiosk/.test(location.hash))document.body.classList.add('kiosk');
  $('#gbtn').onclick=e=>{$('#stage').classList.toggle('showguide');e.target.classList.toggle('on')};
  if(/diag/.test(location.hash)||(window.T204_CONFIG||{}).diag){document.body.classList.add('kiosk');$('#stage').innerHTML='<div id="diag"></div>';window.T204_DIAG&&T204_DIAG($('#diag'));return;}
  let first=true;
  const pull=()=>(window.T204_LOAD?T204_LOAD():Promise.resolve(null)).then(d=>{if(!d)return;
      if(first){DATA=d;build();start=performance.now()}else pending=d; first=false}).catch(e=>{first=false;console.warn('T204 load',e)});setInterval(pull,10*60*1000);setInterval(clockTick,5000);
  let idle;addEventListener('mousemove',()=>{$('#ctl').style.opacity=1;clearTimeout(idle);idle=setTimeout(()=>$('#ctl').style.opacity=0,3000)});
  var start=performance.now();
  pull();
  (function loop(){
    let t=(performance.now()-start)/1000;
    if(t>=LOOP){ start=performance.now(); t=0; if(pending){DATA=pending;pending=null;build()} }
    render(t); requestAnimationFrame(loop);
  })();
}
})();
</script>
</body>
</html>
