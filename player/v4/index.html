<script>/* T204 데이터 로더: relay(중계 파일 1개) / direct(각 API 직접 호출) + 연결 진단 */
(function(){
const CFG = window.T204_CONFIG || {mode:'embedded'};
const pad=n=>String(n).padStart(2,'0');
const kst=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const qs=o=>Object.entries(o).map(([k,v])=>`${k}=${k==='serviceKey'?v:encodeURIComponent(v)}`).join('&');
async function getJSON(url,timeout=12000){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{cache:'no-store',signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json();}
  finally{clearTimeout(t)}
}

/* ---------- 공모주 카드: 날짜 기준으로 화면에서 계산 ---------- */
function toDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ipoCards(list,today,evening){
  const day=86400000, t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const ref=new Date(t0.getTime()+(evening?day:0)); const out=[];
  [...list].sort((a,b)=>a.start.localeCompare(b.start)).forEach(o=>{
    const s=toDate(o.start), e=toDate(o.end);
    if(e<ref || (s-t0)/day>10) return;
    let badge;
    if(s<=t0 && t0<=e){ badge = +e===+t0?'오늘 마감':(evening && +e===+ref?'내일 마감':'청약 중'); }
    else { const n=Math.round((s-t0)/day); badge = n===1?'내일 시작':`D-${n}`; }
    const f=d=>`${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
    out.push({badge,name:o.name,period:`${f(s)} ~ ${f(e)}`,price:o.price,broker:o.broker});
  });
  return out.slice(0,2);
}
function finalize(feed){
  const now=kst();
  feed.date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  feed.dow=DOW[now.getDay()];
  feed.sample=false;
  feed.location=feed.location||'테헤란로 204 · 역삼';
  feed.updated=feed.updated||{morning:'',evening:''};
  feed.sponsor=feed.sponsor||{morning:'',evening:''};
  if(Array.isArray(feed.ipo_list)) feed.ipo={morning:ipoCards(feed.ipo_list,now,false),evening:ipoCards(feed.ipo_list,now,true)};
  return feed;
}

/* ---------- relay: 중계 파일 하나 ---------- */
async function loadRelay(){ return finalize(await getJSON(CFG.feedUrl+'?t='+Date.now())); }

/* ---------- direct: 각 API 직접 호출 ---------- */
const SKY={'1':'맑음','3':'구름많음','4':'흐림'}, PTY={'1':'비','2':'비/눈','3':'눈','4':'소나기','5':'빗방울','6':'빗방울눈날림','7':'눈날림'};
const iconOf=(sky,pty)=>pty&&pty!=='0'?'rain':({'1':'clear','3':'partly','4':'cloudy'}[sky]||'partly');
async function dWeather(){
  const now=kst(); let base=new Date(now); base.setHours(2,0,0,0);
  if(now.getHours()*60+now.getMinutes()<135){base=new Date(base.getTime()-86400000);base.setHours(23)}

      ${it.note?`<div style="display:inline-block;margin-top:30px;font-size:46px;font-weight:700;padding:14px 26px;border-radius:18px;background:rgba(255,255,255,.09)">${it.note}</div>`:''}
      </div>`}).join('')}</div>
    <div class="k" style="margin-top:10px" ${A('fade',.6)}>${basis}</div>`;
  return P(a,b(items,s0,slot));
}
/* B면 기본: 전체 목록 + 현재 항목 강조 */
const listB=(title)=>(items,s0,slot)=>`<div class="h2" style="text-align:right;padding-top:24px" ${A('up',.2)}>${title}</div>
  <div style="margin-top:30px">${items.map((it,i)=>{const st=s0+i*slot,dec=it.dec??2;return `<div class="tickidx" data-s="${st}" data-e="${st+slot}" style="display:flex;justify-content:space-between;align-items:baseline;padding:22px 26px;border-radius:20px;border:2px solid transparent;margin-top:${i?8:0}px" ${A('up',.3+i*.06)}>
    <span style="font-size:${it.short&&it.short.length>4?30:36}px;font-weight:700">${it.short||it.code}</span>
    <span style="text-align:right"><span class="num" style="font-size:38px;font-weight:700">${fmt(it.v,dec)}</span><br><span class="num ${cls(it.d)}" style="font-size:28px;font-weight:700">${sgn(it.d)} ${fmt(Math.abs(it.d),dec)}</span></span></div>`}).join('')}</div>`;
/* 퇴근판 B면: 투자자별 매매 동향 */
const flowB=()=>(items,s0,slot)=>{const f=DATA.kr.flow||[];if(!f.length)return listB('KOREA')(items,s0,slot);return `<div class="h2" style="text-align:right;padding-top:24px" ${A('up',.2)}>코스피 투자자별 매매</div>
  <div class="k" style="text-align:right;font-size:26px;margin-top:6px" ${A('fade',.3)}>순매수 · 억 원</div>
  <div class="stack" style="margin-top:30px">${f.map((x,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:30px 34px" ${A('up',.5+i*.15)}>
    <span style="font-size:46px;font-weight:700">${x.who}</span><span class="num ${cls(x.v)}" style="font-size:58px;font-weight:900">${x.v>0?'+':''}${fmt(x.v,0)}</span></div>`).join('')}</div>`};
/* 공모주 청약 장면: A면·B면에 한 종목씩 */
function scheduleScene(mode){
  const I=DATA.ipo[mode]||[];
  if(!I.length) return P(`<div class="h2" ${A('up',0)}>공모주 청약</div><div class="card" style="margin-top:40px;font-size:48px;font-weight:700;line-height:1.4" ${A('up',.3)}>이번 주 예정된<br>청약이 없습니다</div>`,'');
  const card=(p,d)=>`<div class="card" style="padding:44px 40px" ${A('up',d)}>
      <span class="chip">${p.badge}</span>
      <div style="font-size:${p.name.length>5?56:66}px;font-weight:900;letter-spacing:-.03em;line-height:1.15;margin-top:20px;word-break:keep-all">${p.name}</div>
      ${p.rate?`<div class="k" style="margin-top:26px">최종 경쟁률</div><div class="num" style="font-size:104px;font-weight:900;line-height:1.05;letter-spacing:-.03em">${p.rate}<span style="font-size:48px"> : 1</span></div>`:''}
      ${p.period?`<div class="k" style="margin-top:26px">청약일</div><div class="num" style="font-size:48px;font-weight:700;white-space:nowrap">${p.period}</div>`:''}
      ${p.price?`<div class="k" style="margin-top:18px">공모가</div><div class="num" style="font-size:54px;font-weight:700">${p.price}</div>`:''}
      <div class="k" style="margin-top:22px">${p.broker}</div></div>`;
  return P(`<div class="h2" ${A('up',0)}>공모주 청약</div>
      <div class="h1" ${A('up',.15)}>${I.some(p=>p.rate)?'오늘<br>청약 결과':(mode==='evening'?'다가오는<br>청약 일정':'이번 주<br>청약 일정')}</div>
      <div style="margin-top:50px">${card(I[0],.4)}</div>`,
    `<div style="padding-top:330px">${I[1]?card(I[1],.7):''}</div>`);
}
function trafficScene(){
  const T=DATA.traffic;
  const a=`<div class="h2" ${A('up',0)}>지금 역삼역 일대</div>
    <div class="h1" ${A('up',.15)}>${T.congest||'-'}</div>
    <div class="card" style="margin-top:40px;font-size:46px;font-weight:700;line-height:1.4" ${A('up',.4)}>${T.msg||''}</div>`;
  const b=`<div class="stack" style="padding-top:24px">${(T.roads||[]).map((r,i)=>`<div class="card" ${A('up',.6+i*.15)}><div class="k">${r.name}</div><div class="v num" style="color:${spC(r.kmh)}">${r.kmh}<span style="font-size:32px"> km/h · ${spT(r.kmh)}</span></div></div>`).join('')}</div>`;
  return P(a,b);
}
function rateScene(){
  const R=DATA.rates.items||[];
  const a=`<div class="h2" ${A('up',0)}>오늘의 금리</div>${R.slice(0,1).map(r=>`<div class="k" style="margin-top:50px" ${A('up',.2)}>${r.name}</div><div class="num" style="font-size:180px;font-weight:900;letter-spacing:-.05em" ${A('up',.3)}>${r.v.toFixed(2)}<span style="font-size:80px">%</span></div>`).join('')}`;
  const b=`<div class="stack" style="padding-top:24px">${R.slice(1).map((r,i)=>`<div class="card" ${A('up',.6+i*.15)}><div class="k">${r.name}</div><div class="v num">${r.v.toFixed(2)}%</div></div>`).join('')}</div>`;
  return P(a,b);
}
function build(mode){
  const dm=mode==='today'?'morning':mode;
  SCN=SCNS[mode]; $('.prog').innerHTML=SCN.slice(1,-1).map(()=>'<i><b></b></i>').join('');
  const has=k=>{const x=DATA[k];return !!x&&(Array.isArray(x.items)?x.items.length>0:true)};
  // 오래된 데이터는 표시하지 않음: 날씨=오늘 데이터만, 환율=2일 이내
  const kd=()=>{const d=new Date();return new Date(d.getTime()+(d.getTimezoneOffset()+540)*60000)};
  const ageDays=()=>{if(!DATA.generated_at)return 99;const [y,m,d]=DATA.generated_at.slice(0,10).split('-').map(Number);const t=kd();return Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/86400000)};
  const freshDay=()=>ageDays()===0, fresh2=()=>ageDays()<=2;
  const S={
    weather:{ok:()=>!!DATA.weather&&freshDay(),t:'날씨',f:()=>weatherScene()},
    traffic:{ok:()=>!!DATA.traffic,t:'교통',f:()=>trafficScene()},
    fx:{ok:()=>has('fx')&&fresh2(),t:'환율',f:i=>tickerScene(i,{head:'오늘의 환율',cat:'환율',items:DATA.fx.items,basis:DATA.fx.basis,b:listB('원/외화')})},
    stock:{ok:()=>has('kr'),t:'증시',f:i=>tickerScene(i,{head:'국내 증시 마감',cat:'국내',items:DATA.kr.items,basis:DATA.kr.basis,b:flowB()})},
    rate:{ok:()=>!!DATA.rates,t:'금리',f:()=>rateScene()},
    ipo:{ok:()=>DATA.ipo&&(DATA.ipo[dm]||[]).length>0,t:'공모주 청약',f:()=>scheduleScene(dm)},
  };
  const order={morning:['weather','traffic','ipo','fx','stock'],today:['weather','fx','stock','ipo','rate'],evening:['traffic','fx','stock','rate','ipo','weather']}[mode];
  const picked=order.filter(k=>S[k].ok()).slice(0,3);
  MODES[mode].line=picked.length?picked.map(k=>S[k].t):['중앙일보','테헤란로 T204'];
  const body=picked.map((k,n)=>S[k].f(n+1)); while(body.length<3) body.push(outro());
  $('#scenes').innerHTML=[intro(mode),...body,outro()].map(h=>`<section class="scene">${h}</section>`).join('');
  const st=$('#stage'); st.classList.remove('morning','lunch','evening'); st.classList.add(mode==='today'?'lunch':mode);
  $('#ttl').textContent=MODES[mode].ttl; $('#lab').textContent=MODES[mode].lab;
  $('#clk').textContent=bigDate(); $('#dte').textContent=DATA.dow+' · '+(DATA.generated_at?DATA.generated_at.slice(11,16)+' 기준':DATA.updated[dm]);
  const sp=DATA.sponsor[dm]; $('#spn').innerHTML=sp?`<em>제공</em>${sp}`:'';
  $('#samp').style.display=DATA.sample?'block':'none';
  scenes=[...document.querySelectorAll('.scene')].map((el,i)=>({el,a:SCN[i][0],b:SCN[i][1],
    items:[...el.querySelectorAll('[data-anim]')],counts:[...el.querySelectorAll('[data-count]')],
    heads:[...el.querySelectorAll('.tick')],idx:[...el.querySelectorAll('.tickidx')],
    spins:[...el.querySelectorAll('.spin')],drifts:[...el.querySelectorAll('.drift')],drops:[...el.querySelectorAll('.drop')]}));
  for(const s of scenes){ if(s.a===0||s.b===LOOP) continue;
    s.el.style.display='block';
    const ps=[...s.el.querySelectorAll(':scope>.pa,:scope>.pb')];
    const h=Math.max(...ps.map(p=>p.scrollHeight));
    const top=290+Math.max(0,(1310-h)/2*0.8);
    ps.forEach(p=>p.style.top=top+'px'); s.el.style.display='none'; }
  curMode=mode;
}
let scenes=[],curMode=null;

function render(t,clockText){
  t=((t%LOOP)+LOOP)%LOOP;
  for(const s of scenes){
    if(t<s.a||t>=s.b){s.el.style.display='none';continue}
    s.el.style.display='block';
    const L=t-s.a,inP=out3(seg(L,0,.35)),outP=seg(t,s.b-.45,s.b);
    s.el.style.opacity=Math.min(inP,1-outP);
    s.el.style.transform=`translateY(${-40*out3(outP)}px)`;
    for(const e of s.items){
      const d=+e.dataset.d||0,dur=+(e.dataset.dur||.7),p=seg(L,d,d+dur),q=out3(p);
      switch(e.dataset.anim){
        case 'up':e.style.opacity=q;e.style.transform=`translateY(${(1-q)*60}px)`;break;
        case 'fade':e.style.opacity=q;break;
        case 'scale':e.style.opacity=q;e.style.transform=`scale(${.85+.15*outBack(p)})`;e.style.transformOrigin='left center';break;
        case 'grow':e.style.transform=`scaleX(${q})`;break;
        case 'draw':e.style.strokeDashoffset=1-q;break;
        case 'pop':e.style.opacity=q;e.setAttribute('r',12*(p<1?outBack(p):1));break;
        case 'pop2':e.style.opacity=q;break;
      }
    }
    for(const c of s.counts){const to=+c.dataset.count,fr=+c.dataset.from,dec=+c.dataset.dec,cs=+(c.dataset.cs||0),q=out3(seg(L,cs+.4,cs+1.4));c.textContent=dec?fmt(fr+(to-fr)*q,dec):Math.round(fr+(to-fr)*q)}
    for(const h of s.heads){const a=+h.dataset.s,e=+h.dataset.e,last=h===s.heads[s.heads.length-1];
      const pin=out3(seg(L,a,a+.5)),pout=last?0:out3(seg(L,e-.4,e));
      h.style.opacity=Math.max(0,pin-pout);h.style.transform=`translateY(${(1-pin)*50-pout*40}px)`}
    for(const n of s.idx){const a=+n.dataset.s,e=+n.dataset.e,last=n===s.idx[s.idx.length-1],on=L>=a&&(L<e||last);
      n.style.borderColor=on?'var(--accent)':'var(--line)';n.style.background=on?'rgba(255,106,61,.16)':'transparent'}
    s.spins.forEach(g=>g.setAttribute('transform',`rotate(${t*12})`));
    s.drifts.forEach(g=>g.setAttribute('transform',`translate(${Math.sin(t*.8)*10},0)`));
    s.drops.forEach(r=>{const k=(t*1.3+(+r.dataset.i)*.33)%1;r.setAttribute('transform',`translate(0,${k*70})`);r.style.opacity=1-k});
  }
  document.querySelectorAll('.prog b').forEach((b,i)=>{const [a,e]=SCN[i+1];b.style.width=(seg(t,a,e)*100)+'%'});
  $('#cline').style.transform=`scaleY(${.6+.4*Math.sin(t*.6)})`;
}

function fit(){const st=$('#stage'),s=Math.min(innerWidth/W0,innerHeight/H0);
  st.style.transform=`scale(${s})`;st.style.left=((innerWidth-W0*s)/2)+'px';st.style.top=((innerHeight-H0*s)/2)+'px'}
function autoMode(d=new Date()){const m=d.getHours()*60+d.getMinutes();
  return (m>=6*60+30&&m<11*60)?'morning':(m>=11*60&&m<18*60)?'today':'evening'}
function nowText(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

window.T204={setData(d){DATA=d;if(curMode)build(curMode)},renderAt(t,mode){if(mode!==curMode)build(mode);render(t)},LOOP,W:W0,H:H0};

if(!window.__T204_RENDER){
  addEventListener('resize',fit);fit();
  if(/kiosk/.test(location.hash))document.body.classList.add('kiosk');
  const pick=()=>{const h=location.hash.replace('#','').replace(/-?kiosk/,'');return MODES[h]?h:'auto'};
  let sel=pick();const t0=performance.now();
  const paint=()=>document.querySelectorAll('#ctl button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===sel));
  document.querySelectorAll('#ctl button[data-m]').forEach(b=>b.onclick=()=>{sel=b.dataset.m;location.hash=sel==='auto'?'':sel;paint()});
  $('#gbtn').onclick=e=>{$('#stage').classList.toggle('showguide');e.target.classList.toggle('on')};
  addEventListener('hashchange',()=>{sel=pick();paint()});paint();
  if(/diag/.test(location.hash)||(window.T204_CONFIG||{}).diag){document.body.classList.add('kiosk');$('#stage').innerHTML='<div id="diag"></div>';window.T204_DIAG&&T204_DIAG($('#diag'));return;}
  const pull=()=>(window.T204_LOAD?T204_LOAD():Promise.resolve(null)).then(d=>{if(d)T204.setData(d)}).catch(e=>console.warn('T204 load',e));
  pull();setInterval(pull,10*60*1000);
  let idle;addEventListener('mousemove',()=>{$('#ctl').style.opacity=1;clearTimeout(idle);idle=setTimeout(()=>$('#ctl').style.opacity=0,3000)});
  (function loop(){const mode=sel==='auto'?autoMode():sel;if(mode!==curMode)build(mode);
    render((performance.now()-t0)/1000);requestAnimationFrame(loop)})();
}
})();
</script>
</body>
</html>
