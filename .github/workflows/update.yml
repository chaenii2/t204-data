name: 데이터 갱신 (15분마다)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - template/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  # 예약 실행과 디자인 반영(push)이 서로 기다리지 않도록 분리
  group: update-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 수집 · 플레이어 갱신 · 저장 (예약 실행은 15분 간격 4회 반복)
        timeout-minutes: 58
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          KRX_KEY: ${{ secrets.KRX_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          # GitHub 예약 실행은 15분마다 정확히 돌지 않아(실측 약 1시간 간격) 한 번 실행에서 직접 15분마다 반복
          git config user.name "t204-bot"
          git config user.email "t204-bot@users.noreply.github.com"
          U=https://chaenii2.github.io/t204-data/feed.json
          N=1; [ "${{ github.event_name }}" = "schedule" ] && N=4
          for i in $(seq 1 $N); do
            git pull -q --rebase -X theirs origin main || git rebase --abort || true
            python scripts/build_feed.py . || echo "수집 실패(이전 값 유지)"
            python scripts/build_player.py relay --embed feed.json --feed-url $U --out player
            python scripts/build_player.py relay --embed feed.json --feed-url $U --out player/v4 --template player_v4.src.html
            for c in finance weather traffic; do python scripts/build_player.py relay --embed feed.json --feed-url $U --template player_clip.src.html --clip $c --out player/$c; done
            git add feed.json feed_log.md player
            git commit -q -m "데이터 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')" || echo "변경 없음"
            for t in 1 2 3; do (git pull -q --rebase -X theirs origin main && git push -q) && break || { git rebase --abort 2>/dev/null; sleep 7; }; done
            if [ $i -lt $N ]; then sleep 840; fi
          done
